server.port=${PORT:4000}

# Surface the exception reason (e.g. an upstream Jira/LLM failure) in the error body,
# instead of a bare "Bad Gateway" - the reasons are diagnostic, not sensitive.
server.error.include-message=always

# Supabase (hosted Postgres). Get the connection string from
# Project Settings > Database > Connection string > JDBC in your Supabase project.
# Use the SESSION pooler / direct connection on port 5432 - the transaction pooler
# on 6543 breaks Hibernate prepared statements unless prepareThreshold=0 is set.
spring.datasource.url=${SUPABASE_DB_URL:}
spring.datasource.username=${SUPABASE_DB_USERNAME:}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# The schema is owned by Flyway (src/main/resources/db/migration), never by Hibernate.
# validate = fail fast at boot if the entities and the migrated schema disagree.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# The schema already exists, created by the ddl-auto that Flyway is replacing, so Flyway
# has to be told it may adopt it. baseline-version must be 0: it defaults to 1, which
# would mark V1 as already applied and silently skip the migration.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.show-sql=false
spring.jpa.open-in-view=false


anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-5}

# --- LLM: Google Gemini ---------------------------------------------------------
# Used for fact extraction, question answering and the resume brief. Get a free key at
# https://aistudio.google.com/apikey and put it in .env as GEMINI_API_KEY (never commit it).
# gemini-2.0-flash: fast, free-tier friendly, strong JSON mode, no extra "thinking" tokens.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
gemini.connect-timeout=5s
gemini.read-timeout=60s

# --- Authentication -------------------------------------------------------------
# HS256 signing secret, >= 32 bytes. Generate with: openssl rand -base64 48
# Long-lived because there is no refresh token: with tenant-level login there are no
# separate sessions to rotate or revoke. An issued token stays valid until it expires.
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-ttl=12h

# --- Integration credential encryption ------------------------------------------
# AES-256 key, base64-encoded 32 bytes. Generate with: openssl rand -base64 32
# Rotating this invalidates every stored Jira/GitHub secret, so bump key-version too.
app.crypto.secret-key=${APP_SECRET_KEY:}
app.crypto.key-version=1

# --- Outbound integration calls -------------------------------------------------
# A tenant can have several Jira sites and repos; one unreachable host must not hang
# the request or hold a worker thread open indefinitely.
integrations.connect-timeout=3s
integrations.read-timeout=10s

# Hosts a tenant is allowed to point a connection at. Tenant-supplied base URLs are
# outbound requests made by this server, so an open list is a server-side request
# forgery hole (internal addresses, cloud metadata endpoints).
# .leadratd.com covers the org's Atlassian Cloud custom domain (jira.atlassian.leadratd.com).
integrations.jira.allowed-host-suffixes=.atlassian.net,.leadratd.com
integrations.github.allowed-host-suffixes=api.github.com

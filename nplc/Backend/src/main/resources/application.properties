server.port=4000

# Supabase Postgres. Use the SESSION pooler / direct connection on port 5432 -
# the transaction pooler on 6543 breaks Hibernate prepared statements.
# Credentials come from the environment; never commit them.
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST}:5432/postgres?sslmode=require
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=claude-sonnet-5

# Personal Jira sandbox only - never a company Jira site
jira.site-url=${JIRA_SITE_URL:}
jira.email=${JIRA_EMAIL:}
jira.api-token=${JIRA_API_TOKEN:}

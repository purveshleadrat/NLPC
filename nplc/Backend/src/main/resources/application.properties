server.port=${PORT:4000}

# Supabase (hosted Postgres). Get the connection string from
# Project Settings > Database > Connection string > JDBC in your Supabase project.
# Use the SESSION pooler / direct connection on port 5432 - the transaction pooler
# on 6543 breaks Hibernate prepared statements.
spring.datasource.url=${SUPABASE_DB_URL:}
spring.datasource.username=${SUPABASE_DB_USERNAME:}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=claude-sonnet-5

# Personal Jira sandbox only - never a company Jira site
jira.site-url=${JIRA_SITE_URL:}
jira.email=${JIRA_EMAIL:}
jira.api-token=${JIRA_API_TOKEN:}

# Personal GitHub sandbox repo only - never a company repo
github.api-url=${GITHUB_API_URL:https://api.github.com}
github.owner=${GITHUB_OWNER:}
github.repo=${GITHUB_REPO:}
github.token=${GITHUB_TOKEN:}

server.port=${PORT:4000}

# Postgres on Supabase. Point SPRING_DATASOURCE_URL at the SESSION pooler /
# direct connection host on port 5432 - the transaction pooler on 6543 breaks
# Hibernate prepared statements. Credentials come from the environment (.env
# locally, Render dashboard in deployment); never commit them.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=claude-sonnet-5

# Personal Jira sandbox only - never a company Jira site
jira.site-url=${JIRA_SITE_URL:}
jira.email=${JIRA_EMAIL:}
jira.api-token=${JIRA_API_TOKEN:}
